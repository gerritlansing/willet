name: Release

on:
  push:
    tags: ["v*"]
  # A pull request that changes this workflow runs it as a dry run: everything
  # up to the attestations, with a placeholder version, and nothing published.
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - run: make test

      - name: Build and package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}
        run: |
          make build VERSION="$VERSION" COMMIT="${GITHUB_SHA::7}"
          name="willet_${VERSION#v}_linux_${ARCH}"
          mkdir -p "dist/$name"
          cp bin/willet LICENSE README.md willet.env.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: willet-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0-dryrun' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/willet_${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/willet_${{ env.VERSION }}.spdx.json

      # Assets are uploaded to a draft first: with immutable releases, a
      # published release can't gain or change assets.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
