name: Runner image

# Publishes ghcr.io/<owner>/willet-runner. Each build gets an immutable tag
# <runner version>-<revision>, e.g. 2.337.0-1, where the revision counts the
# commits that changed images/runner. The moving tags <runner version> and
# latest point to the newest build.
#
# GitHub requires self-hosted runners with automatic updates off to move to a
# new runner release within 30 days, so a daily check builds the image when
# actions/runner publishes a new version.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [images/runner/**]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Work out the tags
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/actions/runner/releases/latest --jq .tag_name)
          version=${version#v}
          revision=$(git rev-list --count HEAD -- images/runner)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/willet-runner"
          {
            echo "version=$version"
            echo "full=$version-$revision"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
          if ! docker buildx imagetools inspect "ghcr.io/actions/actions-runner:$version" >/dev/null 2>&1; then
            echo "::notice::ghcr.io/actions/actions-runner:$version is not published yet"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$image:$version-$revision" >/dev/null 2>&1; then
            echo "::notice::$image:$version-$revision already exists"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.runner.outputs.build == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.runner.outputs.build == 'true'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.runner.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.runner.outputs.build == 'true'
        id: build
        with:
          context: images/runner
          platforms: linux/amd64,linux/arm64
          build-args: BASE=ghcr.io/actions/actions-runner:${{ steps.runner.outputs.version }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.runner.outputs.image }}:${{ steps.runner.outputs.full }}
            ${{ steps.runner.outputs.image }}:${{ steps.runner.outputs.version }}
            ${{ steps.runner.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=willet-runner
            org.opencontainers.image.description=GitHub Actions runner image for willet, with iptables for Docker in the VM
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.runner.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.runner.outputs.build == 'true'
        with:
          subject-name: ${{ steps.runner.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
