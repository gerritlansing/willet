name: Vulnerability scan

# Dependabot and the PR dependency review do not cover the Go standard library,
# and a new advisory for a module already in go.mod doesn't fail a PR. A daily
# scan of main surfaces both as a failed run.
#
# Like the PR check, it fails on modules only for high or critical advisories,
# rated by GitHub's advisory database. Standard-library advisories have no
# rating there, so they always fail.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan with govulncheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go tool govulncheck -format json ./... > "$RUNNER_TEMP/vuln.json"
          # Symbol-level findings are the ones in code willet calls, which make vuln fails on.
          # Each row: Go advisory, module, fixed version, GitHub advisories.
          jq -rs '
            (map(select(.osv) | .osv | {key: .id, value: [.aliases[]? | select(startswith("GHSA-"))]}) | from_entries) as $ghsa
            | map(select(.finding.trace[0].function) | .finding
                | [.osv, .trace[0].module, .fixed_version // "no release", ($ghsa[.osv] // [] | join(","))])
            | unique[] | @tsv' "$RUNNER_TEMP/vuln.json" > "$RUNNER_TEMP/findings.tsv"
          failed=0
          while IFS=$'\t' read -r osv module fixed ghsas; do
            if [ "$module" = stdlib ]; then
              echo "::error::$osv in the Go standard library, fixed in Go ${fixed#v}"
              failed=1
              continue
            fi
            severity=unrated
            if [ -n "$ghsas" ]; then
              severity=$(gh api "/advisories/${ghsas%%,*}" --jq .severity)
            fi
            case $severity in
              high | critical)
                echo "::error::$osv ($severity) in $module, fixed in $fixed"
                failed=1
                ;;
              *)
                echo "::warning::$osv ($severity) in $module, fixed in $fixed"
                ;;
            esac
          done < "$RUNNER_TEMP/findings.tsv"
          if [ ! -s "$RUNNER_TEMP/findings.tsv" ]; then
            echo "No vulnerabilities found."
          fi
          exit $failed
